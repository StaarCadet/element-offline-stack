# Configuration file for Synapse.
#
# This is a YAML file: see [1] for a quick introduction. Note in particular
# that *indentation is important*: all the elements of a list or dictionary
# should have the same indentation.
#
# [1] https://docs.ansible.com/ansible/latest/reference_appendices/YAMLSyntax.html
#
# For more information on how to configure Synapse, including a complete accounting of
# each option, go to docs/usage/configuration/config_documentation.md or
# https://element-hq.github.io/synapse/latest/usage/configuration/config_documentation.html
server_name: "matrix.clsim.com"
pid_file: /data/homeserver.pid
listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation, openid]
        compress: false
database:
  name: psycopg2
  args:
    user: synapse
    password: changeme
    dbname: synapse
    host: postgres_synapse
    cp_min: 5
    cp_max: 10
log_config: "/data/matrix.log.config"
media_store_path: /data/media_store
registration_shared_secret: "O6XctjQr*k4VSd~7RN56R:qt:TzY5*rMsY;D9GR,I.VArbr4WQ"
report_stats: true
macaroon_secret_key: "F4Go&98uJGd~sSGvP+x1Fm,CbXE.-oBGle^@#enIpP5J0,09c^"
form_secret: "qD3*BRsI.nCQK.FPbHPejZ24&:NMuwlweuSPYFXA8Vn@05w-9H"
signing_key_path: "/data/matrix.signing.key"
trusted_key_servers:
  - server_name: "matrix.org"
suppress_key_server_warning: true
enable_registration: true
enable_registration_without_verification: true

experimental_features:
  msc3266_enabled: true
  msc4222_enabled: true

max_event_delay_duration: 24h

rc_message:
  per_second: 10000
  burst_count: 10000

rc_login:
  address:
    per_second: 10000
    burst_count: 10000
  account:
    per_second: 10000
    burst_count: 10000
  failed_attempts:
    per_second: 10000
    burst_count: 10000

rc_registration:
  per_second: 10000
  burst_count: 10000

# Required for Element Call in Single Page Mode due to on-the-fly user registration
serve_server_wellknown: true
# vim:ft=yaml
element_call:
  shared_secret: secret
